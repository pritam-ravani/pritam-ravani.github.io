    :root {

      --text-color: #333333;

    }
    
    * {
      margin: 0;
      padding: 0;

    }

      margin-top: 3rem;
    }
    
    h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }
    
    section {
      margin-bottom: 3rem;
    }
    
    .document-list {
      margin-top: 1rem;
    }
    
    .document-item {
      margin-bottom: 1.5rem;
    }
    
    footer {
