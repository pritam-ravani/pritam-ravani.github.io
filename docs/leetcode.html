<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeetCode Guide | Pritam Ravani</title>
  <style>
    :root {
      --bg-color: #f5f1e8;
      --text-color: #333333;
      --link-color: #333333;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: monospace;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid var(--text-color);
    }
    
    a:hover {
      opacity: 0.7;
    }
    
    nav {
      margin-bottom: 3rem;
    }
    
    nav ul {
      list-style-type: none;
      display: flex;
      flex-wrap: wrap;
    }
    
    nav li {
      margin-right: 2rem;
      margin-bottom: 0.5rem;
    }
    
    h1, h2, h3 {
      margin-bottom: 1rem;
    }
    
    h1 {
      font-size: 1.5rem;
    }
    
    h2 {
      font-size: 1.25rem;
      margin-top: 3rem;
      cursor: pointer;
      user-select: none;
    }
    
    h2:hover {
      opacity: 0.7;
    }
    
    h3 {
      font-size: 1rem;
    }
    
    p {
      margin-bottom: 1rem;
    }
    
    section {
      margin-bottom: 3rem;
    }
    
    .stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .stat {
      flex: 1;
      min-width: 120px;
    }
    
    .stat-number {
      font-size: 1.5rem;
      font-weight: bold;
    }
    
    .stat-label {
      font-size: 0.9rem;
      opacity: 0.7;
    }
    
    .controls {
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--text-color);
    }
    
    .search-box {
      margin-bottom: 1rem;
    }
    
    .search-box input {
      font-family: monospace;
      background-color: var(--bg-color);
      border: 1px solid var(--text-color);
      color: var(--text-color);
      padding: 0.5rem;
      width: 100%;
      font-size: 1rem;
    }
    
    .search-box input:focus {
      outline: 2px solid var(--text-color);
    }
    
    .filter-buttons {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .btn {
      font-family: monospace;
      background-color: var(--bg-color);
      border: 1px solid var(--text-color);
      color: var(--text-color);
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    
    .btn:hover {
      background-color: var(--text-color);
      color: var(--bg-color);
    }
    
    .btn.active {
      background-color: var(--text-color);
      color: var(--bg-color);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--text-color);
    }
    
    .section-title {
      display: flex;
      gap: 0.5rem;
      align-items: baseline;
    }
    
    .collapse-icon {
      display: inline-block;
      transition: transform 0.2s;
    }
    
    .section.collapsed .collapse-icon {
      transform: rotate(-90deg);
    }
    
    .section.collapsed .problem-list {
      display: none;
    }
    
    .tag {
      font-size: 0.8rem;
      opacity: 0.6;
      font-style: italic;
    }
    
    .progress-text {
      font-size: 0.9rem;
      opacity: 0.7;
    }
    
    .problem-list {
      margin-bottom: 2rem;
    }
    
    .problem-item {
      display: flex;
      align-items: flex-start;
      padding: 0.5rem 0;
      gap: 1rem;
    }
    
    .problem-item:hover {
      opacity: 0.7;
    }
    
    .checkbox-wrapper {
      flex-shrink: 0;
      padding-top: 0.2rem;
    }
    
    .checkbox-wrapper input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    .problem-info {
      flex: 1;
      display: flex;
      gap: 1rem;
      align-items: baseline;
      flex-wrap: wrap;
    }
    
    .problem-title {
      flex: 1;
      min-width: 200px;
    }
    
    .problem-item.completed .problem-title {
      text-decoration: line-through;
      opacity: 0.5;
    }
    
    .difficulty {
      font-size: 0.85rem;
      padding: 0.1rem 0.5rem;
      border: 1px solid var(--text-color);
      white-space: nowrap;
    }
    
    .difficulty.easy {
      opacity: 0.6;
    }
    
    .difficulty.medium {
      opacity: 0.8;
    }
    
    .difficulty.hard {
      opacity: 1;
    }
    
    .problem-link {
      font-size: 0.85rem;
      white-space: nowrap;
    }
    
    footer {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--text-color);
    }
    
    .hidden {
      display: none;
    }
    
    @media (max-width: 600px) {
      .problem-info {
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .filter-buttons {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
      }
    }
  </style>
</head>

    let currentFilter = 'all';

    function init() {

    function renderProblems() {
      const container = document.getElementById('problems');
      container.innerHTML = '';

      Object.keys(problemsData).forEach(sectionName => {
        const sectionData = problemsData[sectionName];
        const section = document.createElement('section');
        section.className = 'section';
        section.id = getSectionId(sectionName);

        const completed = getCompletedCount(sectionName);
        const total = sectionData.problems.length;

        section.innerHTML = `
          <div class="section-header" onclick="toggleSection('${getSectionId(sectionName)}')">
            <div class="section-title">
              <h2><span class="collapse-icon">▼</span> ${sectionName}</h2>
              ${sectionData.tag ? `<span class="tag">${sectionData.tag}</span>` : ''}
            </div>
            <span class="progress-text">${completed}/${total}</span>
          </div>
          <div class="problem-list">
            ${sectionData.problems.map((problem, index) => 
              createProblemHTML(problem, sectionName, index)
            ).join('')}
          </div>
        `;

        container.appendChild(section);
      });

      applyFilters();
    }

    function createProblemHTML(problem, sectionName, index) {
      const isCompleted = isProblemCompleted(sectionName, index);
      return `
        <div class="problem-item ${isCompleted ? 'completed' : ''}" 
             data-difficulty="${problem.difficulty}" 
             data-completed="${isCompleted}"
             data-title="${problem.title.toLowerCase()}">
          <div class="checkbox-wrapper">
            <input type="checkbox" 
                   ${isCompleted ? 'checked' : ''} 
                   onchange="toggleProblem('${sectionName}', ${index})">
          </div>
          <div class="problem-info">
            <span class="problem-title">${problem.title}</span>
            <span class="difficulty ${problem.difficulty}">[${problem.difficulty}]</span>
            <a href="${problem.link}" target="_blank" class="problem-link">solve →</a>
          </div>
        </div>
      `;
    }

    function toggleProblem(sectionName, index) {
      const key = `${sectionName}-${index}`;
      const storage = getProgress();
      
      if (storage[key]) {
        delete storage[key];
      } else {
        storage[key] = {
          completed: true,
          date: new Date().toISOString()
        };
      }
      
      saveProgress(storage);
      updateStreak();
      renderProblems();
      updateStats();
    }

    function isProblemCompleted(sectionName, index) {
      const storage = getProgress();
      const key = `${sectionName}-${index}`;
      return !!storage[key];
    }

    function getCompletedCount(sectionName) {
      const storage = getProgress();
      let count = 0;
      problemsData[sectionName].problems.forEach((_, index) => {
        if (storage[`${sectionName}-${index}`]) count++;
      });
      return count;
    }

    function getProgress() {
      const data = localStorage.getItem('leetcode-progress');
      return data ? JSON.parse(data) : {};
    }

    function saveProgress(data) {
      localStorage.setItem('leetcode-progress', JSON.stringify(data));
    }

    function updateStats() {
      let total = 0;
      let completed = 0;

      Object.keys(problemsData).forEach(section => {
        total += problemsData[section].problems.length;
        completed += getCompletedCount(section);
      });

      document.getElementById('total-problems').textContent = total;
      document.getElementById('completed-problems').textContent = completed;
      document.getElementById('progress-percentage').textContent = 
        total > 0 ? Math.round((completed / total) * 100) + '%' : '0%';
    }

    function updateStreak() {
      const progress = getProgress();
      const dates = Object.values(progress)
        .map(p => new Date(p.date).toDateString())
        .filter((date, index, self) => self.indexOf(date) === index)
        .sort((a, b) => new Date(b) - new Date(a));

      let streak = 0;
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();

      if (dates.length > 0) {
        if (dates[0] === today || dates[0] === yesterday) {
          streak = 1;
          for (let i = 1; i < dates.length; i++) {
            const currentDate = new Date(dates[i]);
            const previousDate = new Date(dates[i - 1]);
            const diff = (previousDate - currentDate) / 86400000;
            if (diff === 1) {
              streak++;
            } else {
              break;
            }
          }
        }
      }

      document.getElementById('streak-count').textContent = streak;
    }

    function filterDifficulty(difficulty) {
      currentFilter = difficulty;
      applyFilters();
      
      document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function showCompleted() {
      currentFilter = 'completed';
      applyFilters();
      document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function showIncomplete() {
      currentFilter = 'incomplete';
      applyFilters();
      document.querySelectorAll('.filter-buttons .btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function applyFilters() {
      document.querySelectorAll('.problem-item').forEach(item => {
        let show = true;

        if (currentFilter !== 'all' && currentFilter !== 'completed' && currentFilter !== 'incomplete') {
          show = item.dataset.difficulty === currentFilter;
        }

        if (currentFilter === 'completed') {
          show = item.dataset.completed === 'true';
        } else if (currentFilter === 'incomplete') {
          show = item.dataset.completed === 'false';
        }

        if (searchQuery && show) {
          show = item.dataset.title.includes(searchQuery.toLowerCase());
        }

        item.style.display = show ? 'flex' : 'none';
      });

      document.querySelectorAll('.section').forEach(section => {
        const visibleProblems = Array.from(section.querySelectorAll('.problem-item')).filter(
          item => item.style.display !== 'none'
        );
        section.style.display = visibleProblems.length === 0 ? 'none' : 'block';
      });
    }

    function setupEventListeners() {
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        applyFilters();
      });
    }

    function toggleSection(sectionId) {
      const section = document.getElementById(sectionId);
      section.classList.toggle('collapsed');
    }

    function resetProgress() {
      if (confirm('reset all progress? this cannot be undone.')) {
        localStorage.removeItem('leetcode-progress');
        renderProblems();
        updateStats();
        updateStreak();
      }
    }

    function getSectionId(sectionName) {
      return 'section-' + sectionName.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
